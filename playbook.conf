<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <!-- 1. ข้อมูลทั่วไปของ Playbook -->
    <Name>GlendaOS</Name>
    <Title>GlendaOS for Windows</Title>
    <ShortDescription>Custom playbook by Sphx.dev</ShortDescription>
    <Description>Custom playbook by Sphx.dev</Description>
    <Version>1.0</Version>
    <Username>Glenda</Username>
    <UniqueId>19A6B3B1-E139-4A03-A766-DC0F2C5C8BC8</UniqueId>
    <Overhaul>true</Overhaul>
    <SupportedBuilds>
            <string>26300</string>
    </SupportedBuilds>
    <Requirements>
            <Requirement>Internet</Requirement>
            <Requirement>NoPendingUpdates</Requirement>
            <Requirement>NoTweakware</Requirement>
            <Requirement>DefenderToggled</Requirement>
            <Requirement>NoAntivirus</Requirement>
            <Requirement>PluggedIn</Requirement>
    </Requirements>
    <FeaturePages>
        <CheckboxPage IsRequired="true" Description="Select which optional features you would like GlendaOS to apply.">
            <Options>
                <CheckboxOption>
                    <Text>Disable Windows Defender</Text>
                    <Name>disable-defender</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Remove Xbox apps and services</Text>
                    <Name>remove-xbox</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Disable Bluetooth</Text>
                    <Name>disable-bluetooth</Name>
                </CheckboxOption>
            </Options>
            <BottomLine Text="These can be changed later manually."/>
        </CheckboxPage>
    </FeaturePages>
</Playbook>