<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>GlendaOS</Name>
    <Username>GlendaOS</Username>
    <ShortDescription>Official GlendaOS Playbook for Windows 11</ShortDescription>
    <Title>Windows 11 GlendaOS Playbook</Title>
    <Description>This Playbook will modify your installation</Description>
    <Version>1.0.0</Version>
    <UniqueId>d098d22f-3aac-46ef-b035-8b81574e3dcd</UniqueId>
    <Overhaul>true</Overhaul>
    <SupportedBuilds>
            <string>22000</string>
            <string>22621</string>
            <string>22631</string>
            <string>22635</string>
            <string>26100</string>
            <string>26200</string>
            <string>26300</string>
    </SupportedBuilds>
    <Requirements>
            <Requirement>Internet</Requirement>
            <Requirement>NoPendingUpdates</Requirement>
            <Requirement>NoTweakware</Requirement>
            <Requirement>DefenderToggled</Requirement>
            <Requirement>NoAntivirus</Requirement>
            <Requirement>PluggedIn</Requirement>
    </Requirements>
    <FeaturePages>
        <CheckboxPage Description="Choose which optional GlendaOS features to apply during deployment.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Pause Windows Updates until 2036 (manual only)</Text>
                    <Name>manual-updates</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Disable Windows Defender</Text>
                    <Name>defender</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Restore Windows 10 right-click menu</Text>
                    <Name>win10-menu</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
    </FeaturePages>
</Playbook>