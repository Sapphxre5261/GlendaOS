title: Backup
description: Backs up registry before modifications so changes can be restored
actions:
  - !writeStatus: {status: 'Backing up registry'}

  # Export registry hives before any task modifies them
  # Restore later by double-clicking the .reg files
  - !powerShell:
    command: |
      New-Item -Path "$env:SystemRoot\GlendaOS\Backup" -ItemType Directory -Force | Out-Null
      reg export "HKLM\SYSTEM\CurrentControlSet\Services" "$env:SystemRoot\GlendaOS\Backup\services.reg" /y
      reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion" "$env:SystemRoot\GlendaOS\Backup\currentversion.reg" /y
      reg export "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia" "$env:SystemRoot\GlendaOS\Backup\multimedia.reg" /y
    wait: true
