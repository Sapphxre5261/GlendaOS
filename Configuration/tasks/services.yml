# Service selections informed by AtlasOS services.yml, modified 2026-10
# Original work licensed under GPL-3.0: https://github.com/Atlas-OS/Atlas
title: Services
description: Modifies Windows services
actions:
  - !status: {status: 'Configuring services'}

  # Telemetry
  - !service:
    name: "DiagTrack"
    operation: delete

  - !service:
    name: "dmwappushservice"
    operation: delete

  - !service:
    name: "WerSvc"
    operation: delete

  - !service:
    name: "wercplsupport"
    operation: delete

  - !service:
    name: "DPS"
    operation: change
    startup: 4

  - !service:
    name: "WdiServiceHost"
    operation: change
    startup: 4

  - !service:
    name: "WdiSystemHost"
    operation: change
    startup: 4

  - !service:
    name: "PcaSvc"
    operation: change
    startup: 4

  - !service:
    name: "shpamsvc"
    operation: change
    startup: 4

  - !service:
    name: "diagnosticshub.standardcollector.service"
    operation: change
    startup: 4

  - !service:
    name: "UCPD"
    operation: change
    startup: 4

  # Performance
  - !service:
    name: "SysMain"
    operation: change
    startup: 4

  # Memory Compression is not a service - disable via MMAgent
  - !powerShell:
    command: 'Disable-MMAgent -MemoryCompression'
    wait: true

  # Keep AppXSvc on Manual so MS Store / UWP apps can still be installed
  - !service:
    name: "AppXSvc"
    operation: change
    startup: 3

  # Hardware
  - !service:
    name: "Spooler"
    operation: change
    startup: 4

  - !service:
    name: "PrintNotify"
    operation: change
    startup: 4

  - !service:
    name: "Fax"
    operation: change
    startup: 4

  - !service:
    name: "SCardSvr"
    operation: change
    startup: 4

  - !service:
    name: "ScDeviceEnum"
    operation: change
    startup: 4

  - !service:
    name: "SCPolicySvc"
    operation: change
    startup: 4

  - !service:
    name: "SensorService"
    operation: change
    startup: 4

  - !service:
    name: "SensorDataService"
    operation: change
    startup: 4

  - !service:
    name: "SensrSvc"
    operation: change
    startup: 4

  - !service:
    name: "lfsvc"
    operation: change
    startup: 4

  - !service:
    name: "TabletInputService"
    operation: change
    startup: 4

  - !service:
    name: "SEMgrSvc"
    operation: change
    startup: 4

  - !service:
    name: "bthserv"
    operation: change
    startup: 4
    option: 'disable-bluetooth'

  - !service:
    name: "BTAGService"
    operation: change
    startup: 4
    option: 'disable-bluetooth'

  - !service:
    name: "BthAvctpSvc"
    operation: change
    startup: 4
    option: 'disable-bluetooth'

  - !service:
    name: "BluetoothUserService"
    operation: change
    startup: 4
    option: 'disable-bluetooth'

  # Network
  - !service:
    name: "RemoteRegistry"
    operation: change
    startup: 4

  - !service:
    name: "TermService"
    operation: change
    startup: 4

  - !service:
    name: "SessionEnv"
    operation: change
    startup: 4

  - !service:
    name: "UmRdpService"
    operation: change
    startup: 4

  - !service:
    name: "lmhosts"
    operation: change
    startup: 4

  - !service:
    name: "LanmanServer"
    operation: change
    startup: 4

  - !service:
    name: "LanmanWorkstation"
    operation: change
    startup: 4

  - !service:
    name: "TrkWks"
    operation: change
    startup: 4

  - !service:
    name: "SharedAccess"
    operation: change
    startup: 4

  - !service:
    name: "lltdsvc"
    operation: change
    startup: 4

  - !service:
    name: "SSDPSRV"
    operation: change
    startup: 4

  - !service:
    name: "upnphost"
    operation: change
    startup: 4

  - !service:
    name: "RemoteAccess"
    operation: change
    startup: 4

  - !service:
    name: "NetTcpPortSharing"
    operation: change
    startup: 4

  - !service:
    name: "NetBT"
    operation: change
    startup: 4

  - !service:
    name: "CscService"
    operation: change
    startup: 4

  - !service:
    name: "QWAVE"
    operation: change
    startup: 4

  - !service:
    name: "icssvc"
    operation: change
    startup: 4

  # Search & Sync
  - !service:
    name: "WSearch"
    operation: change
    startup: 4

  - !service:
    name: "fhsvc"
    operation: change
    startup: 4

  - !service:
    name: "MapsBroker"
    operation: change
    startup: 4

  - !service:
    name: "OneSyncSvc"
    operation: change
    startup: 4

  - !service:
    name: "UserDataSvc"
    operation: change
    startup: 4

  - !service:
    name: "UnistoreSvc"
    operation: change
    startup: 4

  # Bloatware
  - !service:
    name: "RetailDemo"
    operation: change
    startup: 4

  - !service:
    name: "WalletService"
    operation: change
    startup: 4

  - !service:
    name: "PhoneSvc"
    operation: change
    startup: 4

  - !service:
    name: "AjRouter"
    operation: change
    startup: 4

  - !service:
    name: "wisvc"
    operation: change
    startup: 4

  - !service:
    name: "AppVClient"
    operation: change
    startup: 4

  - !service:
    name: "AxInstSV"
    operation: change
    startup: 4

  - !service:
    name: "ShellHWDetection"
    operation: change
    startup: 4

  - !service:
    name: "tzautoupdate"
    operation: change
    startup: 4

  # Xbox Services
  - !service:
    name: "XblAuthManager"
    operation: change
    startup: 4
    option: 'remove-xbox'

  - !service:
    name: "XblGameSave"
    operation: change
    startup: 4
    option: 'remove-xbox'

  - !service:
    name: "XboxNetApiSvc"
    operation: change
    startup: 4
    option: 'remove-xbox'

  - !service:
    name: "XboxGipSvc"
    operation: change
    startup: 4
    option: 'remove-xbox'
