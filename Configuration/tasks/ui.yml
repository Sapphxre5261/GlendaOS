title: User interface
description: Configures UI
actions:
  - !status: {status: 'Cleaning user interface'}

  - !taskKill: {name: "explorer"}

    # Remove help question mark button in explorer
  - !file:
    path: "%WINDIR%\\HelpPane.exe"
    # Remove advertising in settings app home page
  - !file:
    path: "%WINDIR%\\SystemApps\\MicrosoftWindows.Client.Core_cw5n1h2txyewy\\SystemSettingsExtensions.dll"
  - !file:
    path: "%WINDIR%\\SystemApps\\MicrosoftWindows.Client.CBS_cw5n1h2txyewy\\SystemSettingsExtensions.dll"

  - !run:
    exeDir: true
    exe: "CLEANUP.bat"
    weight: 30

  - !run:
    exeDir: true
    exe: "WINDOWSUPDATE.bat"
    option: "manual-updates"
    weight: 30

    # ACL-protected policy keys (Dsh, Windows Feeds)
  - !run:
    exeDir: true
    exe: "PROTECTED.bat"
    args: "-Policies"
    wait: true
    weight: 30

  - !run: {exe: "explorer.exe", wait: false, runas: currentUser}