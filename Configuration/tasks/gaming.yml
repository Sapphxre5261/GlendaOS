# Power plan approach adapted from ReviOS playbook (meetrevision), modified 2026-10
# Original work licensed under CC BY-SA 4.0: https://github.com/meetrevision/playbook
title: Gaming Optimizations
description: Applies performance tweaks for smoother and more stable gaming
actions:
  - !writeStatus: {status: 'Applying gaming optimizations'}

  # Custom "GlendaOS" power plan - cloned from Ultimate Performance into a fixed GUID
  # (ReviOS approach: aggressive ramp thresholds instead of raw min-state pinning)
  # Adapts to the machine: full aggression on desktop, thermal/battery-aware on laptops
  - !powerShell:
    command: |
      $glenda = 'f1e2d3c4-b5a6-4c7d-8e9f-0a1b2c3d4e5f'
      $isLaptop = [bool](Get-CimInstance -ClassName Win32_Battery -ErrorAction SilentlyContinue)
      if ((powercfg -getactivescheme) -like "*$glenda*") { powercfg -s 381b4222-f694-41f0-9685-ff5bb260df2e }
      powercfg -delete $glenda 2>$null | Out-Null
      # Clone the best available source plan: Ultimate > High Performance > Balanced
      # (Ultimate is absent on many laptops/Home builds, duplicatescheme fails silently there)
      foreach ($src in @('e9a42b02-d5df-448d-aa00-03f14749eb61','8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c','381b4222-f694-41f0-9685-ff5bb260df2e')) {
        powercfg -duplicatescheme $src $glenda 2>$null | Out-Null
        if ((powercfg -l) -match $glenda) { break }
      }
      powercfg -changename $glenda 'GlendaOS' 'Custom performance plan for GlendaOS' 2>$null | Out-Null
      powercfg -s $glenda
      # Aggressive clock ramp-up/down thresholds on every machine (faster boost, holds clocks longer)
      powercfg -setacvalueindex scheme_current sub_processor PERFINCPOL 2
      powercfg -setacvalueindex scheme_current sub_processor PERFDECPOL 1
      powercfg -setacvalueindex scheme_current sub_processor PERFINCTHRESHOLD 10
      powercfg -setacvalueindex scheme_current sub_processor PERFDECTHRESHOLD 8
      powercfg -setacvalueindex scheme_current sub_processor PERFBOOSTMODE 2
      if ($isLaptop) {
        # Laptop: cap idle clocks on AC (Ultimate pins min state to 100% which would cook the chassis),
        # keep core parking enabled, and only kill link power saving on AC so the battery survives DC
        powercfg -setacvalueindex scheme_current sub_processor PROCTHROTTLEMIN 30
        powercfg -setdcvalueindex scheme_current sub_processor PROCTHROTTLEMIN 5
        powercfg -setacvalueindex scheme_current 501a4d13-42af-4429-9fd1-a8218c268e20 ee12f906-d277-404b-b6da-e5fa1a576df5 0
        powercfg -setacvalueindex scheme_current 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 0
      } else {
        # Desktop: all cores unparked (incl. P-cores on hybrid Intel 12th+), link power saving off everywhere
        powercfg -setacvalueindex scheme_current sub_processor CPMINCORES 100
        powercfg -setacvalueindex scheme_current sub_processor CPMINCORES1 100
        powercfg -setacvalueindex scheme_current sub_processor HETEROPOLICY 0 2>$null
        powercfg -setacvalueindex scheme_current sub_processor SCHEDPOLICY 2 2>$null
        powercfg -setacvalueindex SCHEME_CURRENT 501a4d13-42af-4429-9fd1-a8218c268e20 ee12f906-d277-404b-b6da-e5fa1a576df5 0
        powercfg -setdcvalueindex SCHEME_CURRENT 501a4d13-42af-4429-9fd1-a8218c268e20 ee12f906-d277-404b-b6da-e5fa1a576df5 0
        powercfg -setacvalueindex SCHEME_CURRENT 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 0
        powercfg -setdcvalueindex SCHEME_CURRENT 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 0
      }
      # Timeouts: never sleep/hibernate/disk-off on AC, screen off after 15 min
      powercfg /change standby-timeout-ac 0
      powercfg /change standby-timeout-dc 15
      powercfg /change hibernate-timeout-ac 0
      powercfg /change disk-timeout-ac 0
      powercfg /change monitor-timeout-ac 15
      powercfg /change monitor-timeout-dc 5
      powercfg /setactive SCHEME_CURRENT
      # Disable hibernation and Fast Startup (clean driver state every boot, frees RAM-sized disk space)
      powercfg /h off
    wait: true

  # MMCSS: reserve CPU/GPU time for the Games scheduling profile
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', value: 'NetworkThrottlingIndex', type: REG_DWORD, data: '4294967295'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', value: 'SystemResponsiveness', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'GPU Priority', type: REG_DWORD, data: '8'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'Priority', type: REG_DWORD, data: '6'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'Scheduling Category', type: REG_SZ, data: 'High'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'SFIO Priority', type: REG_SZ, data: 'High'}

  # Disable Windows power throttling
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling', value: 'PowerThrottlingOff', type: REG_DWORD, data: '1'}

  # Disable UWP background apps
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications', value: 'GlobalUserDisabled', type: REG_DWORD, data: '1'}

  # Allow games to request 0.5ms timer resolution
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel', value: 'GlobalTimerResolutionRequests', type: REG_DWORD, data: '1'}

  # Win32PrioritySeparation=26: short variable quantum, 3x foreground boost (ReviOS value)
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\PriorityControl', value: 'Win32PrioritySeparation', type: REG_DWORD, data: '26'}

  # Disable VBS, Memory Integrity and Credential Guard (VBS costs ~5-8% FPS)
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard', value: 'EnableVirtualizationBasedSecurity', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity', value: 'Enabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', value: 'LsaCfgFlags', type: REG_DWORD, data: '0'}
  - !powerShell:
    command: |
      bcdedit /set hypervisorlaunchtype off
      # Stop forcing HPET as the platform clock (no-op if never forced; lowers timer latency where it was)
      bcdedit /deletevalue useplatformclock 2>$null | Out-Null
    wait: true

  # Disable Spectre/Meltdown CPU mitigations (trade security for CPU performance)
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management', value: 'FeatureSettingsOverride', type: REG_DWORD, data: '3'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management', value: 'FeatureSettingsOverrideMask', type: REG_DWORD, data: '3'}

  # Disable Reserved Storage (reclaims ~7GB reserved for updates, which are disabled anyway)
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\ReserveManager', value: 'ShippedWithReserves', type: REG_DWORD, data: '0'}

  # Disable Automatic Maintenance (prevents background maintenance during idle/gaming)
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\Maintenance', value: 'MaintenanceDisabled', type: REG_DWORD, data: '1'}

  # Disable mouse pointer precision (raw input, consistent aim)
  - !registryValue: {path: 'HKCU\Control Panel\Mouse', value: 'MouseSpeed', type: REG_SZ, data: '0'}
  - !registryValue: {path: 'HKCU\Control Panel\Mouse', value: 'MouseThreshold1', type: REG_SZ, data: '0'}
  - !registryValue: {path: 'HKCU\Control Panel\Mouse', value: 'MouseThreshold2', type: REG_SZ, data: '0'}

  # Game Mode left at Windows default - the Settings toggle stays user-controllable

  # Remove startup delay for startup apps after logon
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Serialize', value: 'StartupDelayInMSec', type: REG_DWORD, data: '0'}

  # Storage Sense left enabled - low-priority idle cleanup that keeps the drive healthy
