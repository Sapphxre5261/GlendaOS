title: Wallpaper
description: Sets the default desktop wallpaper
actions:
  - !writeStatus: {status: 'Setting wallpaper'}

  # Copy wallpaper into the system so the path survives after playbook files are gone
  # (exeDir:true sets the working dir to Executables\ so Images is the sibling folder)
  - !powerShell:
    command: 'New-Item -Path "$env:SystemRoot\Web\Wallpaper\GlendaOS" -ItemType Directory -Force | Out-Null; Copy-Item -Path "..\Images\wallpaper.png" -Destination "$env:SystemRoot\Web\Wallpaper\GlendaOS\wallpaper.png" -Force'
    exeDir: true
    wait: true

  # Set as default wallpaper for all user hives (Fill style)
  - !registryValue: {path: 'HKCU\Control Panel\Desktop', value: 'Wallpaper', type: REG_SZ, data: 'C:\Windows\Web\Wallpaper\GlendaOS\wallpaper.png'}
  - !registryValue: {path: 'HKCU\Control Panel\Desktop', value: 'WallpaperStyle', type: REG_SZ, data: '10'}
  - !registryValue: {path: 'HKCU\Control Panel\Desktop', value: 'TileWallpaper', type: REG_SZ, data: '0'}

  # Set the same image as the lock screen (Personalization CSP)
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP', value: 'LockScreenImagePath', type: REG_SZ, data: 'C:\Windows\Web\Wallpaper\GlendaOS\wallpaper.png'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP', value: 'LockScreenImageStatus', type: REG_DWORD, data: '1'}

  # Dark theme for both apps and Windows shell
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'AppsUseLightTheme', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'SystemUsesLightTheme', type: REG_DWORD, data: '0'}
